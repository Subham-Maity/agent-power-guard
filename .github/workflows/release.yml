name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Generate MSI Package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build-msi.ps1

      - name: Prepare Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\agent-power-guard.exe dist\agent-power-guard-windows-x64.exe
          Copy-Item target\installer\*.msi dist\AgentPowerGuard-windows-x64.msi

      - name: Sign Windows Artifacts (Conditional)
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
        shell: powershell
        run: |
          if ($env:SIGNPATH_API_TOKEN) {
            Write-Host "SignPath credentials detected. Signing release binaries and MSI installer..."
            # Ready for SignPath GitHub Action or azure-sign-tool once maintainer configures secrets
          } else {
            Write-Host "No SignPath credentials configured; skipping code signing."
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/*

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxss-dev libxkbcommon-dev libwayland-dev xprintidle libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Linux Binary (.tar.gz and .deb)
        run: |
          mkdir -p dist/agent-power-guard
          cp target/x86_64-unknown-linux-gnu/release/agent-power-guard dist/agent-power-guard/
          cp README.md LICENSE dist/agent-power-guard/
          cd dist
          tar -czvf agent-power-guard-linux-x86_64.tar.gz agent-power-guard/
          rm -rf agent-power-guard
          cd ..
          bash packaging/build-deb.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: dist/*

  build-macos:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Release (Apple Silicon aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Release (Intel x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package macOS Binaries (.tar.gz and universal .app)
        run: |
          mkdir -p dist
          tar -czvf dist/agent-power-guard-macos-aarch64.tar.gz -C target/aarch64-apple-darwin/release agent-power-guard
          tar -czvf dist/agent-power-guard-macos-x86_64.tar.gz -C target/x86_64-apple-darwin/release agent-power-guard
          bash packaging/build-macos-app.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type d ! -name '.' -exec rm -rf {} +
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Tag Name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Agent Power Guard ${{ steps.get_tag.outputs.tag }}"
          files: release-assets/*
          draft: false
          prerelease: false
          body: |
            ## 🛡️⚡ Agent Power Guard ${{ steps.get_tag.outputs.tag }} Release

            A lightweight, 100% native desktop utility written in Rust (`egui` + `glow`) that puts your workstation to sleep **only when you AND your AI coding agents are truly idle**.

            ---

            ### 🌟 What's New & Fixed in v1.2.5 (Full Upgrade Since v1.0.3)

            #### 🎨 v1.2.5 UI Overhaul, System Clipboard & Polish
            - **Zero Missing-Glyph Boxes (Custom Vector Icons):** Replaced all missing-glyph Unicode emojis across every tab, top-bar action, modal, tray menu, and card header with crisp anti-aliased vector icons (`UiIcon`) and theme-aware Dark/Light cards (`app_card_frame`).
            - **Reliable System Clipboard Copy & Paste:** Fixed `eframe` clipboard copy/paste (`Copy Prompt`, `Paste Clipboard`, `Copy JSON/CSV`, `Copy Path/Token/Link/MAC`) by pairing `egui` clipboard with UTF-8 native OS clipboard integration (`Set-Clipboard`/`Get-Clipboard` on Windows, `pbcopy`/`pbpaste` on macOS, `xclip`/`wl-copy` on Linux).
            - **Clean 4-Step Watt Calculator Wizard & Clipped-UI Fixes:** Rebuilt the Watt Calculator & AI Estimator into a 4-step readable wizard (`Step 1: Fetch System Specs`, `Step 2: Missing Details, Watt Distribution & Electricity Price`, `Step 3: Generate & Copy AI Prompt`, `Step 4: Paste AI Response & Calculate All Savings`); fixed negative zero (`-0.00`) KPI display, wrapped Energy filter/delete buttons cleanly so nothing clips off-screen, and added vertical scrolling across **Alerts & Updates** and **Remote** tabs.

            #### ⚡ v1.2.4 Features & Bug Fixes
            - **In-Panel Auto-Updater (GitHub Public Releases API):** Queries `/releases` to list all published versions with `[LATEST]` and `[INSTALLED]` badges, downloads matching platform binaries/installers in the background via **Update Now**, prompts to **Install & Restart Now**, and swaps portable `.exe`/tarballs or launches `.msi` cleanly in place (plus a **Built-in Uninstall Software** option).
            - **Custom Watt Calculator & AI Spec Prompt Estimator:** Auto-fetches CPU, RAM, GPU/VRAM, storage, and monitors in the background; adds manual inputs for SMPS/PSU wattage & efficiency, monitor counts, peripherals, and daily hours; computes component-level wall wattage + Daily/Monthly/Yearly savings projections; and generates a copy-ready AI prompt whose JSON reply can be pasted straight back into the app with zero API key needed.
            - **26 Major Currencies (incl. INR `₹`) + Custom Currency & High Tariff Range:** Replaced hardcoded `$` in the Energy History table, raised electricity rate range from `2.0` to `50,000` (fixing `₹9/kWh`+ entry), added a 26-currency selector + custom symbol input, and exposed `Sleep Power (W)` right alongside Active & Monitor watts.
            - **Fixed Sleep Savings Duration Logger:** Measures true wall-clock sleep duration (`before_sleep` -> `after_sleep`) instead of `idle_threshold_secs` (`3 min` vs `8 hours` overnight).
            - **Fixed `powercfg` Audio Overrides & Port Config Consistency:** Added `VB-Audio Virtual Cable (ROOT\MEDIA\0001)`, `FxSound Audio Enhancer (ROOT\MEDIA\0000)`, `USB Audio 2.0`, and `Legacy Kernel Caller`, verified admin exit status instead of failing silently, and wired `config.web_server_port` cleanly across GUI, headless `daemon`, and CLI commands (`status` / `service status`).

            #### 🔧 v1.2.3 Fixes & Accuracy Improvements
            - **Physical-Disk-Bounded I/O Attribution (Fixes Permanent Hold on Windows Browsers/IDEs):** Bounded Cond 5 per-process attribution (`GetProcessIoCounters`, which includes named pipes and Chromium/Electron Mojo IPC) by actual physical SSD throughput (`IOCTL_DISK_PERFORMANCE`), and excluded browser/WebView/crashpad helpers from Cond 5 work attribution so idle browser IPC no longer latches Cond 9 (`Busy 15/15`) at `~10+ MB/s`.
            - **Accurate Blocker Attribution & Live I/O Diagnostics:** Updated Cond 5 and blocker banners to display `<proc> <proc_rate> (Disk <effective_total>)` cleanly, and added a collapsible **Debug: Physical Disk vs Process I/O (Top 5)** view plus `/api/status` `top_io_debug`.
            - **Fixed Adaptive Suggestion Banner Slot Shift (`GPU 13302%`):** Replaced the unnamed `(f32, f32, f32)` tuple with a named `SuggestedThresholds` struct (`pc_cpu_pct`, `disk_kbps`, `net_kbps`), so disk baseline suggestions no longer overwrite `gpu_threshold_pct`.
            - **Preset & Stage 1 Display-Off Sync + Native Win32 Monitor Off:** Synced top-bar `⏱ 15s Test`, `Quick Presets`, and `PowerMode` buttons with `monitor_timeout_mins`, `active_mode`, `apply_monitor_timeout`, and live countdown; added live `Display-off: Xs / Ys` progress and `!is_meeting_live` guard; replaced PowerShell/`Add-Type` subprocess with native Win32 `SendMessageTimeoutW(..., SC_MONITORPOWER, 2, SMTO_ABORTIFHUNG)`.

            #### 🧠 Intent-Aware Sleep Engine & Signal Conditioning (v1.2.x)
            - **Signal-Conditioning Layer:** Every analog metric (Agent CPU, Downloads, PC CPU, Attributed Disk, Default-Route Network, GPU) passes through a rolling-window duty-cycle filter with hysteresis (`Pending` -> `Busy` -> `Quiet`). Single 1-second spikes and `Pending` windows never reset the countdown or kill Stage 1 display-off.
            - **Explicit Intent Classification:** Unified top-level intent hierarchy (`BestPerformance` -> `GuardOff` -> `ExplicitHold` -> `MeetingLive` -> `PassiveMedia` -> `ActiveWork` -> `HumanActive` -> `IdleReady`) controlling Stage 1 display-off and Stage 2 sleep independently.
            - **3 Top-Level Operational Modes & Dedicated OS Wake Lock:** Switch between **Smart Guard** (watchdog actively manages display-off & sleep), **Guard Off** (watchdog pauses so normal OS power settings apply), and **Best Performance** (explicitly disables sleep & display-off via a dedicated OS wake-lock thread using `SetThreadExecutionState` / `systemd-inhibit` / `caffeinate`, with optional `1h / 2h / ∞` timers).
            - **Live Blocker Transparency & Built-in `(i)` Guide:** Every active blocker shows `#`, condition, offending owner/process, live value, hold duration, and inline `+ Ignore` across desktop GUI, tray tooltip, and web dashboard.
            - **Adaptive GPU Baseline + Multi-Adapter NVML Power Draw:** Learns your idle desktop compositor floor (`floor + margin`), polls all NVML devices including board power draw, never triggers on VRAM allocation alone, and surfaces a `Probe Unavailable` badge when NVML is absent.
            - **Per-Process Disk Attribution & Default-Route NIC Filtering:** Subtracts background noise (`MsMpEng`, `SearchIndexer`, `TiWorker`, cloud sync clients) and reports the exact culprit (`cargo.exe 14.2 MB/s`); filters network traffic to default-route interfaces (`0.0.0.0/0`, `::/0`) ignoring loopback, WSL vEthernet, Hyper-V, and Docker virtual adapters; subtracts self-CPU overhead.
            - **Process-Tree Agent CPU Attribution:** Separates idle IDE shells (`code.exe`, `cursor.exe`) from active compiler/agent worker child processes.
            - **Passive Media Detection & Monitor Audio Protection:** CoreAudio render sessions + WinRT SMTC (`GlobalSystemMediaTransportControls`) detect playback and raise a non-focus-stealing topmost prompt (`Keep Awake / Sleep Now / Hide`) bound strictly to session identity (`app + session`) rather than track title, clearing automatically after pause grace (default 60s). Stage 1 display-off stays allowed for audio-only playback unless audio plays through monitor/HDMI speakers (`DigitalAudioDisplayDevice`).
            - **Mic/Cam Signal Presence & App Categories:** Measures real CoreAudio capture peak energy (`Dead / Ambient / Active`) alongside ConsentStore/webcam checks — strict protection for calls (`Zoom`, `Teams`, `Meet`, `Discord`) even when muted, while creative tools (`Premiere`, `Resolve`, `Audacity`, `OBS`) block only on active acoustic/camera capture.
            - **Cond 9 Power Requests Visibility & Safe Degradation:** Surfaces active `powercfg /requests` lock owners with 1-tap ignore, suppresses stale silent browser `DISPLAY` locks (>60s paused), and clearly displays `Probe Unavailable` under standard-user (`AsInvoker`) execution rather than failing silently.
            - **Zombie Agent Lease Watchdog & Wake Classification:** Detects PID-bound leases stuck at ~0% subtree CPU & disk (`lease_idle_mins`), alerts before optional expiry, registers `PowerRegisterSuspendResumeNotification` (GUI & headless daemon) to classify user wakes vs unattended wakes (`120s` fast return timer) without disabling wake events, and suggests adaptive idle baseline floors.
            - **Packaging & Release Fixes:** Fixed GitHub Actions `secrets` conditional syntax blocking release publishing, resolved `sysinfo` interface name `&OsString` handling, updated QR encoder corner separators and security audit fixes, and eliminated cross-platform compiler warnings.

            #### 🚀 Previous Upgrades Now Included in This Release (v1.1.0 Milestones)
            - 🔒 **Secure Local API & Pure Evaluator:** 256-bit API token auth (`0600` on Unix, `%APPDATA%` on Windows), constant-time verification, 10-fail/min IP rate limiting, DNS-rebinding protection + CORS support for fleet polling, and `AsInvoker` manifest so CLI commands run without UAC prompts.
            - 🤖 **AI Coding Agent Integration:** `agent-power-guard run [--max-mins N] -- <cmd>` PID-bound wrapper, built-in `mcp` stdio server for Claude Code / Cursor / Antigravity, and 8 agent profiles.
            - 📊 **Block History, Notifications & Update Check:** Local JSONL timeline answering *"what kept my PC awake?"* with CSV/JSON export, ntfy / Telegram / webhook alerts, and opt-in daily GitHub Releases check.
            - ⏱️ **Power Modes, Quiet Hours, Battery Profiles & Wake Timers:** Balanced / Work / Night / Away presets, quiet-hours downshift, "Sleep After Lease Ends", OS RTC wake timers (`rtcwake`, Task Scheduler, `pmset`), laptop AC vs battery thresholds + low-battery emergency suspend, and carbon grid / currency accounting.
            - 📱 **Mobile PWA Dashboard, Fleet View & Wake-on-LAN:** QR code pairing, live SVG sparklines, 1-tap `+ Ignore`, multi-machine Fleet View tab, `agent-power-guard daemon` headless mode, `agent-power-guard relay` Wake-on-LAN server, and native `.deb`, universal macOS `.app`, and Windows MSI installers.

            ---

            ### 📦 Download & Installation Guide

            | Platform / Architecture | Download Asset | Description & Format |
            |---|---|---|
            | **Windows 10 / 11 (Installer)** | [`AgentPowerGuard-windows-x64.msi`](#) | **Recommended for Windows.** Start Menu, desktop shortcuts, Add/Remove Programs. |
            | **Windows 10 / 11 (Portable)** | [`agent-power-guard-windows-x64.exe`](#) | Portable single-file binary. Runs as standard user (`AsInvoker`) without UAC prompts. |
            | **Debian / Ubuntu Linux** | [`agent-power-guard_1.2.5_amd64.deb`](#) | Native `.deb` package with desktop integration and systemd user unit. |
            | **Linux (Generic tarball)** | [`agent-power-guard-linux-x86_64.tar.gz`](#) | Standalone Linux x86_64 binary supporting X11 & Wayland. |
            | **macOS (Universal Bundle)** | [`AgentPowerGuard-macos-universal.zip`](#) | Universal `.app` bundle for both Apple Silicon (M1–M4) and Intel Macs. |
            | **macOS (Apple Silicon)** | [`agent-power-guard-macos-aarch64.tar.gz`](#) | Raw standalone ARM64 binary. |
            | **macOS (Intel Core x86_64)** | [`agent-power-guard-macos-x86_64.tar.gz`](#) | Raw standalone x86_64 binary. |

            ---

            ### 🚀 Quick Start & Installation

            #### Windows
            - **Installer:** Double-click `AgentPowerGuard-windows-x64.msi` to install, or run silently with:
              ```powershell
              msiexec /i AgentPowerGuard-windows-x64.msi /qn
              ```
            - **Portable:** Download `agent-power-guard-windows-x64.exe` and double-click to launch.

            #### Linux
            ```bash
            sudo apt update
            sudo apt install -y pkg-config libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxss-dev libxkbcommon-dev libwayland-dev xprintidle libgtk-3-dev libayatana-appindicator3-dev
            tar -xzvf agent-power-guard-linux-x86_64.tar.gz
            cd agent-power-guard
            ./agent-power-guard
            ```

            #### macOS
            ```bash
            tar -xzvf agent-power-guard-macos-aarch64.tar.gz
            ./agent-power-guard
            ```

            ---

            ### 💡 Staged Power-Saving Strategy
            1. **Stage 1 (Monitor Off):** Turns off your display first (saves 50–100W immediately and protects screen/OLED) while leaving CPU/GPU active so background agents continue working.
            2. **Stage 2 (Sleep Mode):** Once the monitor is off and all 11 conditions pass, the entire workstation enters deep sleep (< 1W draw).

            ### ⏱️ Quick Presets Included
            - `15s Test`: Instant hands-off countdown test.
            - `3m ★`: Default balanced setting (Display off at 2m -> Sleep at 3m).
            - `5m`, `10m`, `15m`, `30m`, `45m`, `1h`, `2h`, `3h` preset buttons.
            - Custom sliders adjustable from 10s up to 3 hours.

