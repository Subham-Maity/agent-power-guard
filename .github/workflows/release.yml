name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Generate MSI Package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build-msi.ps1

      - name: Prepare Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\agent-power-guard.exe dist\agent-power-guard-windows-x64.exe
          Copy-Item target\installer\*.msi dist\AgentPowerGuard-windows-x64.msi

      - name: Sign Windows Artifacts (Conditional)
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
        shell: powershell
        run: |
          Write-Host "SignPath credentials detected. Signing release binaries and MSI installer..."
          # Ready for SignPath GitHub Action or azure-sign-tool once maintainer configures secrets

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/*

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxss-dev libxkbcommon-dev libwayland-dev xprintidle libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Linux Binary (.tar.gz and .deb)
        run: |
          mkdir -p dist/agent-power-guard
          cp target/x86_64-unknown-linux-gnu/release/agent-power-guard dist/agent-power-guard/
          cp README.md LICENSE dist/agent-power-guard/
          cd dist
          tar -czvf agent-power-guard-linux-x86_64.tar.gz agent-power-guard/
          rm -rf agent-power-guard
          cd ..
          bash packaging/build-deb.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: dist/*

  build-macos:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Release (Apple Silicon aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Release (Intel x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package macOS Binaries (.tar.gz and universal .app)
        run: |
          mkdir -p dist
          tar -czvf dist/agent-power-guard-macos-aarch64.tar.gz -C target/aarch64-apple-darwin/release agent-power-guard
          tar -czvf dist/agent-power-guard-macos-x86_64.tar.gz -C target/x86_64-apple-darwin/release agent-power-guard
          bash packaging/build-macos-app.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Tag Name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Agent Power Guard ${{ steps.get_tag.outputs.tag }}"
          files: release-assets/*
          draft: false
          prerelease: false
          body: |
            ## 🛡️⚡ Agent Power Guard ${{ steps.get_tag.outputs.tag }} Release

            A lightweight, 100% native desktop utility written in Rust (`egui` + `glow`) that puts your workstation to sleep **only when you AND your AI coding agents are truly idle**.

            ---

            ### 🌟 What's New in v1.1.0

            - 🔒 **Secure Local API & Pure Evaluator (Phase 0):**
              - 256-bit API token auth (`0600` permissions on Unix, user profile on Windows).
              - Pure, fully unit-tested decision evaluator with sub-second debounce.
              - Constant-time token verification, 10-fail/min IP rate limiting, and CORS support.
              - Manifest elevation set to `AsInvoker` so CLI commands run without UAC prompts.
            - 🤖 **First-Class AI Coding Agent Integration (Phase 1):**
              - `agent-power-guard run -- <cmd>`: PID-bound execution wrapper; automatically acquires a lease and auto-releases on exit or crash.
              - `agent-power-guard mcp`: Built-in stdio Model Context Protocol (MCP) server for Claude Code, Cursor, and Antigravity.
              - 8 built-in agent profiles (Claude, Cursor, Antigravity, Ollama, Docker, Rust, Node, Python ML) and 1-click process ignore list.
            - 📊 **Observability, History & Multi-Channel Alerts (Phase 2):**
              - **Block-Reason History:** Local JSON Lines audit trail answering *"what kept my PC awake?"* with duration rollups and CSV export.
              - **Notification Channels:** Instant alerts via ntfy, Telegram bots, and custom webhooks.
              - **Opt-in Update Checker:** Daily GitHub Releases semver check with zero machine tracking or telemetry.
            - ⏱️ **Power Scheduling, Quiet Hours & Battery Profiles (Phase 3):**
              - 4 Power Modes: Balanced, Work, Night, and Away.
              - Quiet hours and scheduled "Stay Awake Until" timers.
              - Wake Timers using native OS facilities (`rtcwake`, Windows Task Scheduler, macOS `pmset`).
              - Laptop Battery Awareness: Separate thresholds for AC vs Battery power and low-battery forced suspend.
              - Accurate energy accounting with regional grid carbon factors and customizable tariffs.
            - 📱 **Mobile PWA Remote Dashboard & Fleet Aggregator (Phase 4):**
              - Mobile-responsive dashboard with single-scan QR code pairing.
              - Live SVG sparklines (Agent CPU, GPU, PC CPU, and Network throughput).
              - Top active processes with one-tap ignore button.
              - **Multi-Machine Fleet:** Monitor and control multiple networked PCs from a single dashboard tab.
            - 🐧 **Headless Daemon, Wake Relay & Native Packaging (Phase 5):**
              - `agent-power-guard daemon`: Run as a background service without GUI overhead.
              - `agent-power-guard relay [port]`: Standalone 2 MB Wake-on-LAN micro-relay server.
              - Native `.deb` package generation with systemd user unit.
              - Universal macOS `.app` bundle builder supporting Apple Silicon & Intel.
              - Automated Windows MSI installer via WiX.

            ---

            ### 📦 Download & Installation Guide

            | Platform / Architecture | Download Asset | Description & Format |
            |---|---|---|
            | **Windows 10 / 11 (Installer)** | [`AgentPowerGuard-windows-x64.msi`](#) | **Recommended for Windows.** Start Menu, desktop shortcuts, Add/Remove Programs. |
            | **Windows 10 / 11 (Portable)** | [`agent-power-guard-windows-x64.exe`](#) | Portable single-file binary. Runs without UAC prompts. |
            | **Debian / Ubuntu Linux** | [`agent-power-guard_1.1.0_amd64.deb`](#) | Native `.deb` package with desktop integration and systemd user unit. |
            | **Linux (Generic tarball)** | [`agent-power-guard-linux-x86_64.tar.gz`](#) | Standalone Linux x86_64 binary supporting X11 & Wayland. |
            | **macOS (Universal Bundle)** | [`AgentPowerGuard-macos-universal.zip`](#) | Universal `.app` bundle for both Apple Silicon (M1–M4) and Intel Macs. |
            | **macOS (Apple Silicon)** | [`agent-power-guard-macos-aarch64.tar.gz`](#) | Raw standalone ARM64 binary. |
            | **macOS (Intel Core x86_64)** | [`agent-power-guard-macos-x86_64.tar.gz`](#) | Raw standalone x86_64 binary. |

            ---

            ### 🚀 Quick Start & Installation

            #### Windows
            - **Installer:** Double-click `AgentPowerGuard-windows-x64.msi` to install, or run silently with:
              ```powershell
              msiexec /i AgentPowerGuard-windows-x64.msi /qn
              ```
            - **Portable:** Download `agent-power-guard-windows-x64.exe` and double-click to launch.

            #### Linux
            ```bash
            sudo apt update
            sudo apt install -y pkg-config libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxss-dev libxkbcommon-dev libwayland-dev xprintidle libgtk-3-dev libayatana-appindicator3-dev
            tar -xzvf agent-power-guard-linux-x86_64.tar.gz
            cd agent-power-guard
            ./agent-power-guard
            ```

            #### macOS
            ```bash
            tar -xzvf agent-power-guard-macos-aarch64.tar.gz
            ./agent-power-guard
            ```

            ---

            ### 💡 Staged Power-Saving Strategy
            1. **Stage 1 (Monitor Off):** Turns off your display first (saves 50–100W immediately and protects screen/OLED) while leaving CPU/GPU active so background agents continue working.
            2. **Stage 2 (Sleep Mode):** Once the monitor is off and all 11 conditions pass, the entire workstation enters deep sleep (< 1W draw).

            ### ⏱️ Quick Presets Included
            - `15s Test`: Instant hands-off countdown test.
            - `3m ★`: Default balanced setting (Display off at 2m -> Sleep at 3m).
            - `5m`, `10m`, `15m`, `30m`, `45m`, `1h`, `2h`, `3h` preset buttons.
            - Custom sliders adjustable from 10s up to 3 hours.

