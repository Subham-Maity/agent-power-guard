name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (MSI & EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Generate MSI Package
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\build-msi.ps1

      - name: Prepare Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\agent-power-guard.exe dist\agent-power-guard-windows-x64.exe
          Copy-Item target\installer\*.msi dist\AgentPowerGuard-windows-x64.msi

      - name: Sign Windows Artifacts (Conditional)
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
        shell: powershell
        run: |
          Write-Host "SignPath credentials detected. Signing release binaries and MSI installer..."
          # Ready for SignPath GitHub Action or azure-sign-tool once maintainer configures secrets

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: dist/*

  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxss-dev libxkbcommon-dev libwayland-dev xprintidle libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Linux Binary (.tar.gz and .deb)
        run: |
          mkdir -p dist/agent-power-guard
          cp target/x86_64-unknown-linux-gnu/release/agent-power-guard dist/agent-power-guard/
          cp README.md LICENSE dist/agent-power-guard/
          cd dist
          tar -czvf agent-power-guard-linux-x86_64.tar.gz agent-power-guard/
          rm -rf agent-power-guard
          cd ..
          bash packaging/build-deb.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: dist/*

  build-macos:
    name: Build macOS (Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Release (Apple Silicon aarch64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Release (Intel x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package macOS Binaries (.tar.gz and universal .app)
        run: |
          mkdir -p dist
          tar -czvf dist/agent-power-guard-macos-aarch64.tar.gz -C target/aarch64-apple-darwin/release agent-power-guard
          tar -czvf dist/agent-power-guard-macos-x86_64.tar.gz -C target/x86_64-apple-darwin/release agent-power-guard
          bash packaging/build-macos-app.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Tag Name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "Agent Power Guard ${{ steps.get_tag.outputs.tag }}"
          files: release-assets/*
          draft: false
          prerelease: false
          body: |
            ## 🛡️⚡ Agent Power Guard ${{ steps.get_tag.outputs.tag }} Release

            A lightweight, 100% native desktop utility written in Rust (`egui` + `glow`) that puts your workstation to sleep **only when you AND your AI coding agents are truly idle**.

            ---

            ### 🌟 What's New & Fixed in v1.2.0

            - 🧠 **Intent-Aware Sleep Engine & Unified Signal-Conditioning Filter:**
              - **Signal-Conditioning Layer:** Every analog metric (Agent CPU, Downloads, PC CPU, Attributed Disk, Default-Route Network, GPU) now goes through a rolling-window duty-cycle filter with hysteresis (`Pending` -> `Busy` -> `Quiet`). Transient 1-second spikes and `Pending` windows never reset the countdown or kill Stage 1 display-off.
              - **Explicit Intent Classification:** Unified top-level intent hierarchy (`BestPerformance` -> `GuardOff` -> `ExplicitHold` -> `MeetingLive` -> `PassiveMedia` -> `ActiveWork` -> `HumanActive` -> `IdleReady`) controlling Stage 1 display-off and Stage 2 sleep independently.
            - 🎛️ **3 Clear Operational Modes & Dedicated OS Wake Lock:**
              - **Smart Guard** (watchdog actively manages display-off & sleep), **Guard Off** (watchdog pauses so normal OS power settings apply), and **Best Performance** (explicitly disables sleep & display-off via a dedicated OS wake-lock thread using `SetThreadExecutionState` / `systemd-inhibit` / `caffeinate`, with optional `1h / 2h / ∞` timers).
              - **Live Blocker Transparency & Built-in `(i)` Guide:** Every active blocker shows exact `#`, condition, offending owner/process, live value, hold duration, and inline `+ Ignore` controls across desktop GUI, tray tooltip, and web dashboard.
            - 🔍 **Precision Telemetry & Noise Elimination:**
              - **Adaptive Baseline GPU + NVML Power:** Learns your idle desktop compositor baseline over quiet windows (`floor + margin`), polls all NVML devices including board power draw, never triggers on VRAM allocation alone, and surfaces a `Probe Unavailable` badge when NVML is absent.
              - **Per-Process Disk Attribution & Default-Route NIC Filtering:** Subtracts background noise (`MsMpEng`, `SearchIndexer`, `TiWorker`, cloud sync clients) and reports the actual culprit (`cargo.exe 14.2 MB/s`); filters network traffic to default-route interfaces (`0.0.0.0/0`, `::/0`) ignoring loopback, WSL vEthernet, Hyper-V, and Docker virtual adapters; subtracts self-CPU overhead.
              - **Process-Tree Agent CPU Attribution:** Separates idle IDE shells (`code.exe`, `cursor.exe`) from active compiler/agent worker child processes.
            - 🎬 **Passive Media Detection & Audio Intelligence:**
              - Detects fullscreen/windowed video and media playback via CoreAudio render sessions and WinRT SMTC (`GlobalSystemMediaTransportControls`), raising a non-focus-stealing topmost prompt (`Keep Awake / Sleep Now / Hide`) bound strictly to session identity (`app + session`) rather than track title, and clearing automatically after pause grace (default 60s). Stage 1 display-off still saves screen power during audio-only playback.
              - **Monitor Speaker Protection:** Detects audio routed through monitor/HDMI/DisplayPort endpoints (`DigitalAudioDisplayDevice`) and defers display sleep so HDMI audio doesn't drop.
              - **Mic/Cam Signal Presence & App Categories:** Measures real CoreAudio capture peak energy (`Dead / Ambient / Active`) alongside ConsentStore/webcam checks — strict protection for calls (`Zoom`, `Teams`, `Meet`, `Discord`) even when muted, while creative tools (`Premiere`, `Resolve`, `Audacity`, `OBS`) only block on active acoustic/camera capture.
            - ⚡ **Reliability, Wakeup & Power Request Fixes:**
              - **Cond 9 Power Requests Visibility & Safe Degradation:** Surfaces active `powercfg /requests` lock owners with 1-tap ignore, suppresses stale silent browser `DISPLAY` locks (>60s paused), and clearly displays `Probe Unavailable` under standard-user (`AsInvoker`) execution rather than failing silently.
              - **Zombie Agent Lease Watchdog:** Detects PID-bound leases stuck at ~0% subtree CPU & disk over extended periods (`lease_idle_mins`), sends alerts first, and offers opt-in auto-expiry.
              - **Wake Source Classification & Short Return Path:** Registers `PowerRegisterSuspendResumeNotification` cleanly (working in both GUI and headless daemon mode) to classify user wakes vs unattended network/maintenance wakes (using a fast `120s` unattended return-to-sleep timer) without disabling wake events.
              - **Adaptive Idle Baseline Suggestions:** Learns quiet idle CPU/GPU/Disk baselines and offers 1-click threshold tuning in the UI.
            - 📦 **Previous v1.1.0 Capabilities Included:** 256-bit API token auth with CORS support for LAN fleet polling, `run` CLI wrapper, built-in `mcp` server, ntfy/Telegram/webhook notifications, block history JSONL/CSV audit log, QR pairing & PWA mobile dashboard, Wake-on-LAN relay & `.deb`/macOS `.app`/Windows MSI packaging.

            ---

            ### 📦 Download & Installation Guide

            | Platform / Architecture | Download Asset | Description & Format |
            |---|---|---|
            | **Windows 10 / 11 (Installer)** | [`AgentPowerGuard-windows-x64.msi`](#) | **Recommended for Windows.** Start Menu, desktop shortcuts, Add/Remove Programs. |
            | **Windows 10 / 11 (Portable)** | [`agent-power-guard-windows-x64.exe`](#) | Portable single-file binary. Runs as standard user (`AsInvoker`) without UAC prompts. |
            | **Debian / Ubuntu Linux** | [`agent-power-guard_1.2.0_amd64.deb`](#) | Native `.deb` package with desktop integration and systemd user unit. |
            | **Linux (Generic tarball)** | [`agent-power-guard-linux-x86_64.tar.gz`](#) | Standalone Linux x86_64 binary supporting X11 & Wayland. |
            | **macOS (Universal Bundle)** | [`AgentPowerGuard-macos-universal.zip`](#) | Universal `.app` bundle for both Apple Silicon (M1–M4) and Intel Macs. |
            | **macOS (Apple Silicon)** | [`agent-power-guard-macos-aarch64.tar.gz`](#) | Raw standalone ARM64 binary. |
            | **macOS (Intel Core x86_64)** | [`agent-power-guard-macos-x86_64.tar.gz`](#) | Raw standalone x86_64 binary. |

            ---

            ### 🚀 Quick Start & Installation

            #### Windows
            - **Installer:** Double-click `AgentPowerGuard-windows-x64.msi` to install, or run silently with:
              ```powershell
              msiexec /i AgentPowerGuard-windows-x64.msi /qn
              ```
            - **Portable:** Download `agent-power-guard-windows-x64.exe` and double-click to launch.

            #### Linux
            ```bash
            sudo apt update
            sudo apt install -y pkg-config libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxss-dev libxkbcommon-dev libwayland-dev xprintidle libgtk-3-dev libayatana-appindicator3-dev
            tar -xzvf agent-power-guard-linux-x86_64.tar.gz
            cd agent-power-guard
            ./agent-power-guard
            ```

            #### macOS
            ```bash
            tar -xzvf agent-power-guard-macos-aarch64.tar.gz
            ./agent-power-guard
            ```

            ---

            ### 💡 Staged Power-Saving Strategy
            1. **Stage 1 (Monitor Off):** Turns off your display first (saves 50–100W immediately and protects screen/OLED) while leaving CPU/GPU active so background agents continue working.
            2. **Stage 2 (Sleep Mode):** Once the monitor is off and all 11 conditions pass, the entire workstation enters deep sleep (< 1W draw).

            ### ⏱️ Quick Presets Included
            - `15s Test`: Instant hands-off countdown test.
            - `3m ★`: Default balanced setting (Display off at 2m -> Sleep at 3m).
            - `5m`, `10m`, `15m`, `30m`, `45m`, `1h`, `2h`, `3h` preset buttons.
            - Custom sliders adjustable from 10s up to 3 hours.

